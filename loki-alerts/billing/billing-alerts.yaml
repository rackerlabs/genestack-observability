---
# Alerts on the structured summary lines flex-billing emits at the end of every
# run: billing_run_summary: once per run, billing_summary_<product>: per
# product. Field reference is in the Logging section of the flex-billing README.
#
# Complements alerts/billing/flex-billing-job-failure.yaml, which infers health
# from kube_cronjob_status_last_successful_time and needs 13h to fire.
groups:
  - name: flex-billing-delivery
    # 30m, not the 1m used elsewhere here: events go out once daily at 00:30
    # with a 12:30 fail-safe re-run, and the ranges below are 5d and 7d, so
    # tighter evaluation only rescans days of DEBUG logs.
    interval: 30m
    rules:
      # ALERT: a usage window had runs but none succeeded -- that day's usage
      # may never have reached Cloud Feeds. Critical.
      #
      # MATH: windows with runs, minus windows with a *successful* run, over 5d.
      # Grouped by window_start so both daily runs count toward the same window,
      # meaning a 00:30 failure rescued by the 12:30 fail-safe never fires, and
      # a window nothing ever completed stays flagged for the full 5d even once
      # later days are healthy. Clears only when a run succeeds for that window.
      # `unless` also keeps it quiet when nothing logged at all, so a logging
      # outage or a fresh deploy does not alert on absence.
      #
      # Do not group by per-run fields (outcome, events_failed): `unless`
      # matches the whole label set, so a partial run would stop being cancelled
      # by the successful one. Do not use delivery_status_class either -- the
      # 12:30 run is legitimately 100% 4xx, since 409 means already delivered.
      # Sliding time buckets cannot work here: one straddling the successes on
      # either side of a bad day masks it, and Loki has no subqueries.
      - alert: flex-billing-window-unbilled
        expr: |
          count by (window_start, datacenter) (
            count_over_time(
              {app="flex-billing", namespace="flex-billing"}
              |= "billing_run_summary:"
              | regexp "billing_run_summary: (?P<payload>.*)$"
              | line_format "{{.payload}}"
              | json
              | __error__ = ""
              | dryrun = "false"
              [5d]
            )
          )
          unless
          count by (window_start, datacenter) (
            count_over_time(
              {app="flex-billing", namespace="flex-billing"}
              |= "billing_run_summary:"
              | regexp "billing_run_summary: (?P<payload>.*)$"
              | line_format "{{.payload}}"
              | json
              | __error__ = ""
              | dryrun = "false"
              | outcome = "ok"
              [5d]
            )
          )
        for: 0m
        labels:
          severity: critical
          service: billing
          component: flex-billing
          group_name: flex-billing-delivery
          correlation_key: cronjob/flex-billing/flex-billing-cronjob
          correlation_scope: cronjob
        annotations:
          summary: >-
            flex-billing never billed usage window
            {{ $labels.window_start }} in {{ $labels.datacenter }}
          description: >-
            No successful flex-billing run has billed the usage window starting
            {{ $labels.window_start }} in {{ $labels.datacenter }}. {{ $value }}
            run(s) attempted that window and every one reported an outcome other
            than ok, so the day's usage may never have reached Cloud Feeds;
            outcome=partial means events failed delivery to every required
            AtomHopper endpoint and the run exited 3, outcome=failed means it
            aborted and exited 2. For the per-product breakdown run:
            logcli-parallel --since=120h '{app="flex-billing"} |=
            "billing_summary_" |= "{{ $labels.window_start }}"' and read
            events_failed, delivery_status and atomhopper on each product line.
            Note that 409 responses are duplicate events rather than failures
            and never contribute to this alert. Re-running the window with
            flex-billing --date once the cause is fixed will clear this alert;
            it otherwise keeps firing for 5 days even if later windows bill
            cleanly.
          runbook_url: default_runbook_url
          dashboard_url: default_dashboard_url

      # ALERT: a product's billable resource count fell below 70% of its own
      # trailing 7-day average. Warning -- delivery is fine, this catches
      # billing less than we should, which no job-level check can see.
      #
      # MATH: mean resources_attempted over 24h / mean over the 7d before that.
      # That field is used because both daily runs report the same value, while
      # events_sent collapses to 0 on the fail-safe run by design. As a ratio,
      # $value is the ratio itself, and division makes thin data safe: x/0 and
      # 0/0 both fail the comparison, so a product with no history cannot fire.
      #
      # THRESHOLDS: ratio < 0.7, and a floor requiring the baseline above 5
      # resources, since percentages are meaningless on single digits where
      # 3 -> 2 is a 33% drop. The floor tests the baseline, not today, so a
      # product collapsing to zero is still caught; products under 5 get no
      # coverage at all. Tune the floor first per environment. product is safe
      # to group by here -- a comparison, not an `unless`, so nothing cancels.
      - alert: flex-billing-product-volume-drop
        expr: |
          (
            avg_over_time(
              {app="flex-billing", namespace="flex-billing"}
              |= "billing_summary_"
              | regexp "billing_summary_[a-z]+: (?P<payload>.*)$"
              | line_format "{{.payload}}"
              | json
              | dryrun = "false"
              | unwrap resources_attempted
              | __error__ = ""
              [24h]
            ) by (product, datacenter)
            /
            avg_over_time(
              {app="flex-billing", namespace="flex-billing"}
              |= "billing_summary_"
              | regexp "billing_summary_[a-z]+: (?P<payload>.*)$"
              | line_format "{{.payload}}"
              | json
              | dryrun = "false"
              | unwrap resources_attempted
              | __error__ = ""
              [7d] offset 24h
            ) by (product, datacenter)
          ) < 0.7
          and
          avg_over_time(
            {app="flex-billing", namespace="flex-billing"}
            |= "billing_summary_"
            | regexp "billing_summary_[a-z]+: (?P<payload>.*)$"
            | line_format "{{.payload}}"
            | json
            | dryrun = "false"
            | unwrap resources_attempted
            | __error__ = ""
            [7d] offset 24h
          ) by (product, datacenter) > 5
        # A variance signal deserves confirmation across a couple of evaluations.
        for: 1h
        labels:
          severity: warning
          service: billing
          component: flex-billing
          group_name: flex-billing-delivery
          correlation_key: cronjob/flex-billing/flex-billing-cronjob
          correlation_scope: cronjob
        annotations:
          summary: >-
            flex-billing {{ $labels.product }} billable resources down sharply
            in {{ $labels.datacenter }}
          description: >-
            The {{ $labels.product }} product billed resources at
            {{ $value | humanizePercentage }} of its trailing 7-day average in
            {{ $labels.datacenter }}. This counts resources that produced at
            least one event, so a drop means either customers genuinely removed
            resources, or something is discarding them before an event is built
            -- a tenant lookup failure, an audit drop, or a Gnocchi query
            returning less than it should. Compare recent runs with:
            logcli-parallel --since=120h '{app="flex-billing"} |=
            "billing_summary_{{ $labels.product }}:"' and read resources_examined
            against resources_attempted. If examined held steady while attempted
            fell, the resources are being filtered rather than deleted, which
            points at a bug rather than churn. Delivery is unaffected, so this is
            a billing accuracy signal rather than an outage.
          runbook_url: default_runbook_url
          dashboard_url: default_dashboard_url
